version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.dev.yml — Development overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Differences from production:
#   - Backend runs with nodemon (hot reload via volume mount)
#   - Frontend runs Create React App dev server (hot reload)
#   - MongoDB exposed on host port 27017 for direct access
#   - NODE_ENV set to development
# ──────────────────────────────────────────────────────────────────────────────

services:

  mongodb:
    ports:
      - "27017:27017"   # Expose to host for tools like Compass

  backend:
    build:
      context: ./server
      target: deps      # Use the deps stage (no final stage optimizations)
    command: ["npx", "nodemon", "server.js"]
    environment:
      NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules   # Anonymous volume prevents host node_modules overwriting container's
    ports:
      - "5000:5000"         # Expose API directly for testing

  frontend:
    build:
      context: ./client
      target: builder
    command: ["npm", "start"]
    environment:
      CHOKIDAR_USEPOLLING: "true"   # Required for hot reload in Docker on some systems
      WDS_SOCKET_PORT: 0
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
